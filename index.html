<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遇你 - 技术支持</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 50%, #fce4ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
        }
        .app-icon {
            width: 80px; height: 80px;
            border-radius: 20px;
            margin: 0 auto 24px;
            display: block;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #1a1a1a; }
        .subtitle { font-size: 14px; color: #999; margin-bottom: 32px; }
        .info {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: left;
        }
        .info p { font-size: 15px; color: #333; margin-bottom: 12px; line-height: 1.6; }
        .info p:last-child { margin-bottom: 0; }
        .email {
            display: inline-block;
            margin-top: 16px;
            color: #ff69b4;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }
        .footer { font-size: 12px; color: #bbb; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <img class="app-icon" src="AppIcon.png" alt="遇你 App 图标">
        <h1>遇你</h1>
        <p class="subtitle">蓝牙邂逅 · 遇见身边的 Ta</p>

        <div class="info">
            <p><strong>App 名称：</strong>遇你</p>
            <p><strong>版本：</strong>1.0</p>
            <p><strong>技术支持：</strong>使用中遇到任何问题，欢迎通过以下方式联系我们</p>
            <a class="email" href="mailto:kasimu1992@126.com">kasimu1992@126.com</a>
        </div>

        <p class="footer">© 2026 遇你 · 每一次遇见，都是命中注定</p>
    </div>
</body>
</html>
